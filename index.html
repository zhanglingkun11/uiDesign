<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子政务系统一体化监控仪表板 (V2.1 - 完整版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg-color: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-secondary-color: #8b949e;
            --color-green: #238636;
            --color-blue: #388bfd;
            --color-yellow: #d29922;
            --color-orange: #f0883e;
            --color-red: #da3633;
            --color-purple: #a371f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 2rem);
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #f0f6fc;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr 1fr;
            gap: 1rem;
            flex-grow: 1;
        }

        .panel {
            background-color: var(--panel-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        
        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }

        /* A: Core Metrics */
        .core-metrics {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .metric-item { text-align: center; }
        .metric-item .value { font-size: 2rem; font-weight: 600; }
        .metric-item .label { font-size: 0.9rem; color: var(--text-secondary-color); margin-top: 0.25rem; }
        .metric-item .value.green { color: var(--color-green); }
        .metric-item .value.orange { color: var(--color-orange); }
        .metric-item .value.red { color: var(--color-red); }

        /* B: Stability Radar & Resources */
        .stability-panel { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; gap: 1rem; }
        .radar-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        .resource-container .water-level {
            margin-bottom: 0.75rem;
        }
        .water-level .label { font-size: 0.9rem; margin-bottom: 0.25rem; display: block;}
        .level-bar-bg { background-color: var(--border-color); border-radius: 4px; height: 1.5rem; padding: 4px; }
        .level-bar-fg { height: 100%; border-radius: 2px; transition: width 0.5s ease-out; }
        
        /* C: Alert Center */
        .alert-center-panel { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 1rem; }
        .alert-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .alert-list li { padding: 0.5rem; border-left: 4px solid; margin-bottom: 0.5rem; background-color: rgba(0,0,0,0.1); border-radius: 0 4px 4px 0; }
        .alert-list .predictive { border-color: var(--color-purple); }
        .alert-list .anomaly { border-color: var(--color-yellow); }
        .alert-list .active-p0 { border-color: var(--color-red); animation: pulse-red 1s infinite; }
        .alert-list .active-p1 { border-color: var(--color-orange); }
        .alert-list .icon { margin-right: 0.5rem; }
        .alert-list .time { color: var(--text-secondary-color); font-size: 0.8rem; margin-left: 1rem; }
        .alert-list .message { font-size: 0.9rem; }

        /* D: Application & Log Correlation Panel */
        .apm-panel { grid-row: 3; grid-column: 1; display: flex; flex-direction: column; gap: 1rem; }
        .service-card-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px; /* for scrollbar */
        }
        .service-card-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .service-card {
            background-color: #21262d;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: grid;
            grid-template-columns: 1fr auto auto;
            grid-template-rows: auto auto;
            gap: 0.5rem 1rem;
            border-left: 4px solid var(--color-green);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .service-card:hover {
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(56, 139, 253, 0.3);
        }
        .service-card.status-orange { border-left-color: var(--color-orange); }
        .service-card.status-red { border-left-color: var(--color-red); }

        .service-card .name {
            grid-column: 1 / 4;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .service-card .sparkline-container {
            grid-column: 1;
            grid-row: 2;
            height: 40px;
        }
        .service-card .log-counter {
            grid-row: 2;
            text-align: center;
        }
        .service-card .log-counter .value {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .service-card .log-counter .label {
            font-size: 0.8rem;
            color: var(--text-secondary-color);
        }
        .service-card .log-counter .error-value { color: var(--color-red); }
        .service-card .log-counter .action-value { color: var(--color-orange); }

        .top-event-lists {
            display: flex;
            gap: 1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
        .top-event-container {
            flex: 1;
            min-width: 0; /* Important for flexbox ellipsis */
        }
        .sub-panel-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }
        .top-list { list-style: none; padding: 0; margin: 0; }
        .top-list li {
            font-size: 0.85rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-list li:last-child { border-bottom: none; }
        .top-list .rate { float: right; color: var(--color-red); font-weight: bold; padding-left: 1rem; }

        /* E: Log Analysis */
        .log-panel { grid-row: 3; grid-column: 2; display: flex; flex-direction: column; gap: 1rem; }
        .log-stream { background-color: #010409; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.8rem; padding: 0.5rem; overflow-y: auto; flex-grow: 1; border-radius: 4px; }
        .log-line { white-space: pre-wrap; word-break: break-all; margin-bottom: 0.25rem; }
        .log-line .timestamp { color: #58a6ff; }
        .log-line .level-ERROR { color: #f85149; font-weight: bold; }
        .log-line .service { color: #a371f7; }
        .log-line .trace-id { color: #79c0ff; text-decoration: underline; cursor: pointer; }
        .log-cluster-list { list-style: none; padding: 0; margin: 0; }
        .log-cluster-item { background-color: #21262d; padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; }
        .log-cluster-item .pattern { font-size: 0.9rem; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-cluster-item .count { color: var(--text-secondary-color); font-size: 0.8rem; }
        
        /* Animations */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(218, 54, 51, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(218, 54, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(218, 54, 51, 0); }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>电子政务系统 - 运维作战指挥中心</h1>
    </header>

    <div class="main-container">
        <!-- A: Core Metrics -->
        <div class="panel core-metrics">
            <div class="metric-item">
                <div id="sla" class="value green">99.98%</div>
                <div class="label">系统可用率 (24H)</div>
            </div>
            <div class="metric-item">
                <div id="mttr" class="value green">15.2</div>
                <div class="label">平均修复时间 (分钟)</div>
            </div>
            <div class="metric-item">
                <div id="active-alerts" class="value orange">2</div>
                <div class="label">活跃P0/P1告警</div>
            </div>
            <div class="metric-item">
                <div id="predictive-risks" class="value red">3</div>
                <div class="label">预测性风险 (7D)</div>
            </div>
        </div>

        <!-- B: Stability Radar & Resources -->
        <div class="panel stability-panel">
            <div>
                <div class="panel-title">系统稳定性雷达</div>
                <div class="radar-container">
                    <canvas id="stability-radar"></canvas>
                </div>
            </div>
            <div>
                <div class="panel-title">核心集群资源水位</div>
                <div id="resource-levels" class="resource-container"></div>
            </div>
        </div>

        <!-- C: Alert Center -->
        <div class="panel alert-center-panel">
            <div class="panel-title">智能预警与异常事件中心</div>
            <ul id="alert-list" class="alert-list"></ul>
        </div>

        <!-- D: Application & Log Correlation Panel -->
        <div class="panel apm-panel">
            <div class="panel-title">应用与日志关联分析中心</div>
            <div class="service-card-list-container">
                <ul id="service-card-list" class="service-card-list">
                    <!-- Service cards will be injected by JS -->
                </ul>
            </div>
            <div class="top-event-lists">
                <div class="top-event-container">
                    <h4 class="sub-panel-title">Top 5 新增错误日志</h4>
                    <ul id="top-new-errors-list" class="top-list"></ul>
                </div>
                <div class="top-event-container">
                    <h4 class="sub-panel-title">Top 5 用户失败行为</h4>
                    <ul id="top-failed-actions-list" class="top-list"></ul>
                </div>
            </div>
        </div>


        <!-- E: Log Analysis -->
        <div class="panel log-panel">
            <div>
                <div class="panel-title">实时错误日志流</div>
                <div id="log-stream" class="log-stream"></div>
            </div>
            <div>
                 <div class="panel-title">错误日志聚类 Top 5</div>
                 <ul id="log-cluster-list" class="log-cluster-list"></ul>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // --- Mock Data ---
    const mockData = {
        coreMetrics: { sla: 99.98, mttr: 15.2, activeAlerts: 2, predictiveRisks: 3 },
        stabilityRadar: {
            labels: ['性能', '可用性', '负载', '吞吐', '数据', '体验'],
            values: [85, 99, 75, 90, 95, 80] // out of 100
        },
        resources: [
            { name: 'Web应用集群', cpu: 65, mem: 72 },
            { name: '数据库集群', cpu: 88, mem: 60 },
            { name: '缓存集群', cpu: 45, mem: 55 }
        ],
        alerts: [
            { type: 'predictive', icon: 'fa-crystal-ball', message: '数据库归档存储将在约 3 天后耗尽' },
            { type: 'active-p0', icon: 'fa-fire', message: '身份认证服务(instance-03)宕机' },
            { type: 'anomaly', icon: 'fa-wave-square', message: '“社保查询接口”响应时间突然从 50ms 上升至 200ms' },
            { type: 'active-p1', icon: 'fa-exclamation-triangle', message: '数据库主库CPU使用率达到 95%' },
            { type: 'predictive', icon: 'fa-crystal-ball', message: 'www.gov.cn 的SSL证书将在 12 天后过期' },
            { type: 'anomaly', icon: 'fa-user-secret', message: 'IP 123.45.67.89 登录失败次数过多' },
        ],
        services: [
            { name: '身份认证', qps: 1200, latency: 85, errorLogs: 152, failedActions: 340, status: 'red' },
            { name: '电子证照', qps: 850, latency: 120, errorLogs: 5, failedActions: 12, status: 'green' },
            { name: '公共支付', qps: 430, latency: 350, errorLogs: 88, failedActions: 156, status: 'orange' },
            { name: '社保服务', qps: 2500, latency: 210, errorLogs: 45, failedActions: 98, status: 'orange' },
            { name: '不动产登记', qps: 300, latency: 150, errorLogs: 2, failedActions: 5, status: 'green' }
        ],
        topNewErrors: [
            { service: '支付服务', pattern: 'Database connection refused', rate: 32 },
            { service: '证照服务', pattern: 'Timeout fetching upstream data', rate: 15 },
            { service: '认证服务', pattern: 'Invalid JWT signature', rate: 9 },
            { service: '社保服务', pattern: 'ID card validation failed', rate: 5 },
            { service: '数据共享', pattern: 'Upstream service unavailable', rate: 3 }
        ],
        topFailedActions: [
            { action: '用户登录失败 - 密码错误', count: 102 },
            { action: '提交申请 - 材料不完整', count: 56 },
            { action: '在线支付 - 网关超时', count: 23 },
            { action: '刷新Token - Token过期', count: 18 },
            { action: '查询公积金 - 身份未核验', count: 11 },
        ],
        logs: [
            { level: 'ERROR', service: 'auth-service', msg: 'Failed to connect to database: timeout expired', traceId: 'a1b2c3d4' },
            { level: 'ERROR', service: 'payment-service', msg: 'NullPointerException at com.gov.pay.process(Pay.java:123)', traceId: 'e5f6g7h8' },
            { level: 'ERROR', service: 'social-security', msg: 'Upstream service [data-sharing] returned 503', traceId: 'i9j0k1l2' },
        ],
        logClusters: [
            { pattern: 'NullPointerException at com.gov.pay.process(*)', count: 1205 },
            { pattern: 'Connect to database timed out', count: 89 },
            { pattern: 'Upstream service * returned 503', count: 72 },
            { pattern: 'Invalid argument provided for "userId"', count: 45 },
            { pattern: 'SSL handshake failed with peer', count: 12 },
        ]
    };

    // --- Chart instances & DOM elements ---
    let stabilityRadarChart;
    let serviceSparklineCharts = {};
    const resourceLevelsEl = document.getElementById('resource-levels');
    const alertListEl = document.getElementById('alert-list');
    const serviceCardListEl = document.getElementById('service-card-list');
    const topNewErrorsListEl = document.getElementById('top-new-errors-list');
    const topFailedActionsListEl = document.getElementById('top-failed-actions-list');
    const logStreamEl = document.getElementById('log-stream');
    const logClusterListEl = document.getElementById('log-cluster-list');


    // --- Render Functions ---
    function renderCoreMetrics() { /* Static for this prototype */ }
    
    function renderStabilityRadar() {
        const ctx = document.getElementById('stability-radar').getContext('2d');
        const data = mockData.stabilityRadar;
        stabilityRadarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: data.labels,
                datasets: [{
                    label: '系统健康度',
                    data: data.values,
                    backgroundColor: 'rgba(56, 139, 253, 0.2)',
                    borderColor: 'rgba(56, 139, 253, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(56, 139, 253, 1)'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
                        grid: { color: 'rgba(255, 255, 255, 0.2)' },
                        pointLabels: { color: 'var(--text-color)', font: { size: 12 } },
                        ticks: { display: false, beginAtZero: true, max: 100 }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function renderResources() {
        resourceLevelsEl.innerHTML = '';
        mockData.resources.forEach(res => {
            const cpuColor = res.cpu > 85 ? 'var(--color-red)' : res.cpu > 70 ? 'var(--color-orange)' : 'var(--color-green)';
            resourceLevelsEl.innerHTML += `
                <div class="water-level">
                    <label>${res.name}</label>
                    <div class="level-bar-bg">
                        <div class="level-bar-fg" style="width: ${res.cpu}%; background-color: ${cpuColor};" title="CPU: ${res.cpu}%"></div>
                    </div>
                </div>`;
        });
    }

    function renderAlerts() {
        alertListEl.innerHTML = '';
        mockData.alerts.forEach(alert => {
            alertListEl.innerHTML += `
                <li class="${alert.type}">
                    <i class="fas ${alert.icon} icon"></i>
                    <span class="message">${alert.message}</span>
                    <span class="time">${new Date().toLocaleTimeString()}</span>
                </li>`;
        });
    }

    function renderApmPanel() {
        // Render Service Cards
        serviceCardListEl.innerHTML = '';
        mockData.services.forEach((service, index) => {
            const card = document.createElement('li');
            card.className = `service-card status-${service.status}`;
            card.innerHTML = `
                <div class="name">${service.name}</div>
                <div class="sparkline-container"><canvas id="sparkline-${index}"></canvas></div>
                <div class="log-counter">
                    <div class="value error-value">${Math.round(service.errorLogs)}</div>
                    <div class="label">错误日志</div>
                </div>
                <div class="log-counter">
                    <div class="value action-value">${Math.round(service.failedActions)}</div>
                    <div class="label">用户失败</div>
                </div>`;
            serviceCardListEl.appendChild(card);

            const ctx = document.getElementById(`sparkline-${index}`).getContext('2d');
            if (serviceSparklineCharts[index]) {
                serviceSparklineCharts[index].data.datasets[0].data.push(service.latency);
                serviceSparklineCharts[index].data.datasets[0].data.shift();
                serviceSparklineCharts[index].update('none');
            } else {
                const initialData = Array(20).fill(service.latency).map(v => v + (Math.random() - 0.5) * 20);
                serviceSparklineCharts[index] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array(20).fill(''),
                        datasets: [{ data: initialData, borderColor: 'var(--color-blue)', borderWidth: 2, pointRadius: 0, tension: 0.4 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } }, animation: false }
                });
            }
        });

        // Render Top Event Lists
        topNewErrorsListEl.innerHTML = '';
        mockData.topNewErrors.forEach(err => {
            topNewErrorsListEl.innerHTML += `<li>[${err.service}] ${err.pattern}<span class="rate">+${err.rate}/分</span></li>`;
        });

        topFailedActionsListEl.innerHTML = '';
        mockData.topFailedActions.forEach(action => {
            topFailedActionsListEl.innerHTML += `<li>${action.action}<span class="rate">${action.count}次</span></li>`;
        });
    }


    function renderLogs() {
        logStreamEl.innerHTML = '';
        mockData.logs.forEach(log => {
             logStreamEl.innerHTML += `
                <div class="log-line">
                    <span class="timestamp">[${new Date().toISOString()}]</span>
                    <span class="level-${log.level}">${log.level}</span>
                    <span class="service">[${log.service}]</span>
                    <span>${log.msg}</span>
                    <span class="trace-id" title="点击查看完整链路追踪">[TraceID: ${log.traceId}]</span>
                </div>`;
        });
        logStreamEl.scrollTop = logStreamEl.scrollHeight;
    }
    
    function renderLogClusters() {
        logClusterListEl.innerHTML = '';
        mockData.logClusters.forEach(cluster => {
            logClusterListEl.innerHTML += `
                <li class="log-cluster-item">
                    <div class="pattern" title="${cluster.pattern}">${cluster.pattern}</div>
                    <div class="count">出现次数: ${cluster.count.toLocaleString()}</div>
                </li>`;
        });
    }

    // --- Update Loop ---
    function updateData() {
        // Simulate radar changes
        mockData.stabilityRadar.values = mockData.stabilityRadar.values.map(v => {
            let newVal = v + (Math.random() - 0.5) * 5;
            return Math.max(50, Math.min(100, newVal));
        });
        stabilityRadarChart.data.datasets[0].data = mockData.stabilityRadar.values;
        stabilityRadarChart.update();

        // Simulate APM panel data changes
        mockData.services.forEach(s => {
            s.latency += (Math.random() - 0.5) * 10;
            if (s.latency < 50) s.latency = 50;
            if (s.status !== 'green' && Math.random() > 0.5) {
                s.errorLogs += Math.random() * 3;
                s.failedActions += Math.random() * 5;
            }
        });
        renderApmPanel();

        // Simulate new log
        if (Math.random() > 0.7) {
            const randomService = mockData.services[Math.floor(Math.random() * mockData.services.length)];
            const newLog = { level: 'ERROR', service: randomService.name.toLowerCase().replace(' ', '-'), msg: 'A new simulated error occurred.', traceId: (Math.random() + 1).toString(36).substring(2) };
            mockData.logs.push(newLog);
            if(mockData.logs.length > 20) mockData.logs.shift();
            renderLogs();
        }
    }

    // --- Initial Render & Interval ---
    renderCoreMetrics();
    renderStabilityRadar();
    renderResources();
    renderAlerts();
    renderApmPanel();
    renderLogs();
    renderLogClusters();

    setInterval(updateData, 2000);
});
</script>

</body>
</html>
